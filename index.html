<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nikolai's Site</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", "Trebuchet MS", Verdana, sans-serif;
    text-align: center;
    overflow: hidden;
  }
  body {
    background: linear-gradient(120deg, #87ceeb, #3fa9e0, #a7e8ff, #4fb8e0, #87ceeb);
    background-size: 400% 400%;
    animation: shimmer 8s ease infinite;
  }
  @keyframes shimmer {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  h1 {
    font-size: 4rem;
    color: #ffffff;
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.8), 2px 2px 6px rgba(0, 0, 0, 0.2);
    margin-bottom: 0.5rem;
  }
  p {
    font-size: 1.3rem;
    color: #0d2c3a;
  }
  .hmm-btn {
    margin-top: 1.5rem;
    padding: 0.8rem 2rem;
    font-size: 1.2rem;
    font-weight: bold;
    color: #ffffff;
    background: linear-gradient(180deg, #5ec2f0, #1f7fc4);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow:
      0 6px 0 #135a8f,
      0 10px 14px rgba(0, 0, 0, 0.3);
    transform: translateY(0);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .hmm-btn:hover {
    background: linear-gradient(180deg, #6ecbf5, #2a8fd6);
  }
  .hmm-btn:active {
    transform: translateY(6px);
    box-shadow:
      0 0 0 #135a8f,
      0 4px 6px rgba(0, 0, 0, 0.3);
  }
  #message {
    margin-top: 1.2rem;
    font-size: 1.2rem;
    font-weight: bold;
    color: #0d2c3a;
    min-height: 1.6rem;
  }
</style>
</head>
<body>
  <div>
    <h1>Nikolai's Site</h1>
    <p>In my free time, I like playing the piano.</p>
    <button class="hmm-btn" onclick="document.getElementById('message').textContent = 'Hello, Nikolai! You just built your 26th website.'">Hmm...</button>
    <div id="message"></div>
  </div>
</body>
</html>
